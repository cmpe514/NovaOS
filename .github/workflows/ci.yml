# NovaOS CI: builds the kernel, userspace and bootable image, then boots it in QEMU (BIOS, UEFI and the
# recovery entry) and drives the UI with real key events. Uploads the serial logs, screenshots and the image.
name: ci
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qemu-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: tools/nova-deps.sh
      - name: make doctor
        run: make doctor
      - name: make image
        run: make image
      - name: make test (QEMU, BIOS + UEFI + recovery)
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          make test
      - name: make package
        run: make package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novaos-qemu-x86_64
          path: |
            out/test/
            out/novaos-*.iso
            out/novaos-*.sha256
            out/novaos-*.tar.gz
            out/MANIFEST*.txt
          retention-days: 14

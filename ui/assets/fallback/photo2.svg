<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <!-- NovaOS fallback photo 2: colourful digital swirl (original artwork, CC0). -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5f9e"/><stop offset=".35" stop-color="#ffb347"/><stop offset=".65" stop-color="#3fd6c6"/><stop offset="1" stop-color="#4b5bff"/></linearGradient>
    <filter id="t" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="turbulence" baseFrequency=".004 .012" numOctaves="3" seed="3" result="w"/><feDisplacementMap in="SourceGraphic" in2="w" scale="220" xChannelSelector="R" yChannelSelector="G"/></filter>
  </defs>
  <rect width="800" height="600" fill="#0d0b2a"/>
  <g filter="url(#t)" fill="none" stroke="url(#g)" stroke-width="34" stroke-linecap="round" opacity=".9">
    <circle cx="400" cy="300" r="70"/><circle cx="400" cy="300" r="140"/><circle cx="400" cy="300" r="210"/><circle cx="400" cy="300" r="280"/>

# Used when this ISO is booted from another GRUB with "loopback" (e.g. Ventoy-style multiboot sticks).
set default=0
set timeout=%%TIMEOUT%%
set timeout_style=%%TIMEOUT_STYLE%%
# GRUB also talks to the first serial port, so boot problems show up in headless logs (smoke test).
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial
insmod all_video
insmod gfxterm
set gfxpayload=keep
set menu_color_normal=light-gray/black
set menu_color_highlight=black/cyan

menuentry "%%NAME%%" --id novaos {
    linux  /live/vmlinuz %%APPEND%% findiso=${iso_path}
    initrd /live/initrd.img
}
menuentry "%%NAME%% — safe mode (software graphics, basic video)" --id safe {
    linux  /live/vmlinuz %%APPEND_SAFE%% findiso=${iso_path}
    initrd /live/initrd.img
}
menuentry "%%NAME%% — recovery" --id recovery {
    linux  /live/vmlinuz %%APPEND_RECOVERY%% findiso=${iso_path}
    initrd /live/initrd.img
}
if [ "$grub_platform" = "efi" ]; then
    menuentry "Firmware settings (UEFI)" --id uefi-firmware { fwsetup }
fi
